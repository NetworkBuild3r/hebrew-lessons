<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>היום — צפוף</title>
    <link rel="stylesheet" href="look.css">
</head>
<body>
    <div class="page">
        <nav class="tool" aria-label="יעדים">
            <a href="today.html" aria-current="page">היום</a>
            <a class="primary" href="lesson-step.html">השיעור</a>
            <a href="#due">חזרה</a>
        </nav>
        <main class="split">
            <section class="panel" aria-labelledby="next-heading">
                <p class="kicker">השיעור הבא בתוכנית</p>
                <h1 id="next-heading">בוקר בבית הקפה</h1>
                <p class="pointed-line">היכרות עם שָׁלוֹם, קָפֶה, בֹּקֶר.</p>
                <p class="gloss"><span class="meaning" lang="en" dir="ltr">hello, coffee, morning</span></p>
                <p class="meta">בלוק: <span lang="en" dir="ltr">introduction</span></p>
            </section>
            <section class="panel" id="due" aria-labelledby="due-heading">
                <h2 id="due-heading">לחזרה</h2>
                <p class="stat">4 מילים שמחכות לחזרה היום.</p>
            </section>
        </main>
        <fieldset class="scheme">
            <legend>ערכת צבעים</legend>
            <label><input id="scheme-system" type="radio" name="scheme" checked> לפי המערכת</label>
            <label><input id="scheme-light" type="radio" name="scheme"> בהירה</label>
            <label><input id="scheme-dark" type="radio" name="scheme"> כהה</label>
        </fieldset>
    </div>
</body>
</html>
