<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דרך עברית — דפי עבודה</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/worksheet.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div>
                <div class="kicker">דרך עברית • Light &amp; Easy Hebrew</div>
                <h1>דפי עבודה</h1>
                <p class="subtitle">בחרו שיעור. כל דף נפתח לבד, והתשובות נשמרות בדפדפן.</p>
            </div>
        </div>
    </header>
    <main class="wrap">
        <div class="home-list" id="lessons"></div>
    </main>
    <script src="worksheets/catalog.js"></script>
    <script>
        const lessons = window.HEBREW_CATALOG || [];
        const list = document.getElementById('lessons');
        list.innerHTML = lessons.map(lesson => `
            <a class="lesson-card" href="worksheets/${lesson.slug}/index.html">
                <p class="fine">${lesson.subtitle || ''}</p>
                <h2>${lesson.title}</h2>
                ${lesson.blurb ? `<p>${lesson.blurb}</p>` : ''}
            </a>
        `).join('') || '<div class="card"><p>אין עדיין דפי עבודה בקטלוג.</p></div>';
    </script>
</body>
</html>
