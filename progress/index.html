<!DOCTYPE html>
<html lang="he" dir="rtl" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <meta name="theme-color" content="#1d4ed8">
    <title>התקדמות — Progress · דרך עברית</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/worksheet.css">
</head>
<body class="progress-page">
    <div id="app-shell"></div>
    <header class="topbar page-heading">
        <div class="topbar-inner progress-top">
            <div>
                <div class="kicker">דרך עברית • Light &amp; Easy Hebrew</div>
                <h1>התקדמות <span class="en" dir="ltr">(Progress)</span></h1>
                <p class="subtitle">שלבים ודיוק לפי כיוון <span class="en" dir="ltr">(Stages and accuracy by direction)</span></p>
            </div>
        </div>
    </header>
    <main class="wrap" id="progress-app" aria-live="polite">
        <div class="card progress-card" data-progress-state="loading">
            <p>טוען… <span class="en" dir="ltr">(Loading…)</span></p>
        </div>
    </main>
    <!-- INIT-002/SPEC-015 -->
    <script src="../shared/player/utils.js"></script>
    <script src="../shared/api.js"></script>
    <script src="../shared/app-shell.js"></script>
    <script src="../shared/progress-page.js"></script>
    <script>
        if (window.HebrewShell) {
            window.HebrewShell.mount(document.getElementById('app-shell'));
        }
    </script>
</body>
</html>
