services:
  hebrew:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      HEBREW_ROOT: /app
      # Optional: point LESSONS_DIR at a persistent volume so MCP writes survive image rebuilds.
      # LESSONS_DIR: /data/worksheets
      # Ports are published on 127.0.0.1 only. Set MCP_AUTH_TOKEN to require a bearer token.
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_ALLOW_NO_AUTH: "1"
      # Secrets come from env_file (.env locally). Do NOT set ELEVENLABS_API_KEY here —
      # an empty ${ELEVENLABS_API_KEY:-} would override env_file and wipe the key.
      # In k8s, inject ELEVENLABS_API_KEY from the vault Secret instead (see deploy/k8s-lessons-volume.md).
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-6WRlPmU1fqPwYbSxeP16}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_v3}
    volumes:
      - .:/app
      - /app/node_modules
