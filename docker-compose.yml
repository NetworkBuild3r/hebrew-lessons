services:
  hebrew:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8787:8787"
    environment:
      HOST: 0.0.0.0
      HEBREW_ROOT: /app
      # Optional: point LESSONS_DIR at a persistent volume so MCP writes survive image rebuilds.
      # LESSONS_DIR: /data/worksheets
      # Ports are published on 127.0.0.1 only. Set MCP_AUTH_TOKEN to require a bearer token.
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_ALLOW_NO_AUTH: "1"
    volumes:
      - .:/app
      - /app/node_modules
