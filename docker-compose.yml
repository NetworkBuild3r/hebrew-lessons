services:
  hebrew:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      HEBREW_ROOT: /app
      DATA_DIR: /app/data
      COOKIE_SECURE: "0"
      PUBLIC_ORIGIN: http://localhost:8080
      # Optional: point LESSONS_DIR at a persistent volume so MCP writes survive image rebuilds.
      # LESSONS_DIR: /data/worksheets
      # Ports are published on 127.0.0.1 only. MCP_AUTH_TOKEN is required (no empty default).
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      # Secrets come from env_file (.env locally). Do NOT set ELEVENLABS_API_KEY,
      # OPENAI_API_KEY, ADMIN_USERNAME, or ADMIN_PASSWORD here — an empty ${VAR:-}
      # would override env_file and wipe the value. In k8s, inject them from the
      # vault Secret (see deploy/k8s-database.md). ADMIN_* is used only when the DB has no admin.
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-6WRlPmU1fqPwYbSxeP16}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_v3}
      # Plain env (not a secret). Unset/empty/ladder = ladder; fsrs = FSRS-6.
      # Do not flip production to fsrs without the language-program rollout gate.
      SRS_SCHEDULER: ${SRS_SCHEDULER:-}
      # Login throttle and CSRF scheme. Comma-separated proxy IPs or CIDRs.
      # Empty trusts nobody: the throttle uses the socket address, and
      # X-Forwarded-Proto is ignored. See deploy/k8s-database.md.
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
    volumes:
      - .:/app
      - /app/node_modules
