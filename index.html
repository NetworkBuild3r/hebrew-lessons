<!DOCTYPE html>
<html lang="he" dir="rtl" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <meta name="theme-color" content="#1d4ed8">
    <title>היום — Today · דרך עברית</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="shared/worksheet.css">
</head>
<body class="today-page">
    <div id="app-shell"></div>
    <header class="topbar page-heading">
        <div class="topbar-inner">
            <div>
                <div class="kicker">דרך עברית • Light &amp; Easy Hebrew</div>
                <h1>היום <span class="en" dir="ltr">(Today)</span></h1>
                <p class="subtitle">מה כדאי לעשות עכשיו. <span class="en" dir="ltr">(What to do now.)</span></p>
            </div>
        </div>
    </header>
    <main class="wrap" id="today-app" aria-live="polite">
        <div class="card today-state" data-today-state="loading">
            <p>טוען… <span class="en" dir="ltr">(Loading…)</span></p>
        </div>
    </main>
    <!-- INIT-002/SPEC-014: catalog via script tag; progress via /api/ only -->
    <script src="shared/player/utils.js"></script>
    <script src="shared/player/review.js"></script>
    <script src="shared/api.js"></script>
    <script src="shared/player/sync.js"></script>
    <script src="shared/app-shell.js"></script>
    <script src="worksheets/catalog.js"></script>
    <script src="shared/today-page.js"></script>
    <script>
        if (window.HebrewShell) {
            window.HebrewShell.mount(document.getElementById('app-shell'));
        }
    </script>
</body>
</html>
