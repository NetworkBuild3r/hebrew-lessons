# hebrew v3. Publishes ghcr.io/networkbuild3r/hebrew only.
# Never ghcr.io/networkbuild3r/hebrew-lessons: Argo Image Updater deploys
# the newest sha- tag of that image to production.
#
# v3 is the line that publishes (ADR-0018, D6). v2 is frozen and no longer
# publishes. Only one branch may publish sha- tags at a time, because Argo
# Image Updater deploys whichever sha- tag was pushed last.
#
# Runs only on the local ARC scale set registered to this repo (see home_k3
# apps/arc-runner-set-hebrew). Never use GitHub-hosted runners.
#
# k8-build talks to the shared docker-builder daemon
# (DOCKER_HOST=tcp://docker-builder.arc-runners.svc:2375), not a dind sidecar.
# That node keeps a buildx cache on disk. The registry cache below is what
# still hits if the job lands on another node. type=gha is not used here.
# Do not set DOCKER_HOST here.
#
# Do not publish ports. DOCKER_HOST is the shared remote daemon, so -p is not
# reachable from this runner and a fixed port collides with another job. The
# smoke step joins the app container's network (--network container:) instead.
#
# pull_request on k8-build is refused when the head repository is a fork.
# pull_request has no base-branch filter, so a stacked pull request (its base
# is another PR branch, not v3) still runs. Jobs skip when github.base_ref is
# main; main's own workflows cover those. A pull request builds and smokes
# with contents: read and never logs in or pushes. packages: write is only
# on the publish job, which runs on a push to v3.
#
# Checkouts do not pin pull_request.head.sha. Omitting ref is the
# pull_request default: actions/checkout uses github.ref
# (refs/pull/N/merge) and github.sha, the test merge of the head into the
# base when that event fired. A green check is that merged tree. Pinning the
# head is what let #78 pass and then fail to compile once merged with v2.
# On a push, the omitted ref resolves to the pushed commit. Publish sets
# ref to github.sha, so the image tag stays
# ghcr.io/networkbuild3r/hebrew:sha-<push sha>. Smoke and publish keep
# fetch-depth 1. The test shards fetch the base ref on pull_request and
# diff origin/$BASE...HEAD. A push to v3 and workflow_dispatch run every
# package in all four shards. A pull_request tests only the affected
# packages. templ's git diff is the worktree against the checked-out commit.
# There is no pull_request_target. External actions are pinned to a commit.
name: ci

on:
  push:
    branches: [v3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/networkbuild3r/hebrew

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shard:
    name: shard (${{ matrix.title }})
    runs-on: k8-build
    timeout-minutes: 45
    # Four shards. home_k3 #53 raised the runner cap to 5, so one pull
    # request is these four plus build-and-smoke. The job named test, below,
    # needs this whole matrix. fail-fast stays off so one shard's failure
    # still leaves the other timings in the log. An empty shard exits
    # success; the job is never skipped for an empty package list, so a
    # docs-only pull request does not block needs. Web is its own shard.
    # On run 39495509954 the race step on shard C was 623s, web 352s and
    # db 214s, while A and B finished in about 7m15–7m30. db stays on the
    # catch-all shard. A package that is not placement, activity, brief,
    # learner, or web lands there on its own.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: placement
            title: A placement
          - shard: app
            title: B activity brief learner
          - shard: rest
            title: C rest
          - shard: web
            title: D web
    env:
      CGO_ENABLED: "0"
    # github.base_ref is empty on a push, so a push to v3 still runs.
    # Fork pull requests never reach this runner.
    if: >-
      github.base_ref != 'main' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      # Read-only. continue-on-error and exit 0 so a missing mount or df
      # cannot fail the shard. home_k3 #55 puts NODE_NAME in the runner env.
      # mountinfo field 4 is the path inside the filesystem that was mounted.
      # Field 4 equal to /opt/go-cache means that directory is on the node's
      # root filesystem, not a volume whose own root is mounted there.
      - name: Runner info
        continue-on-error: true
        shell: bash
        run: |
          echo "node=${NODE_NAME:-unset}"
          echo "mountinfo:"
          grep -F '/opt/go-cache' /proc/self/mountinfo || echo "(no /opt/go-cache line)"
          echo "df /opt/go-cache:"
          df -hT /opt/go-cache || echo "df /opt/go-cache failed"
          echo "df /:"
          df -hT / || echo "df / failed"
          exit 0

      # No ref on purpose. pull_request checks out refs/pull/N/merge at
      # github.sha (the merge commit). A push checks out the pushed commit.
      # fetch-depth 0 so a pull_request can diff origin/$BASE...HEAD.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Skip when go.mod is absent
        id: module
        shell: bash
        run: |
          set -euo pipefail
          if [ -f go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "go.mod is present."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Go tests skipped::go.mod is not in this commit. Tests are skipped."
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.module.outputs.present == 'true'
        with:
          go-version-file: go.mod
          # The slow part of this job is the race detector, not module download.
          # actions/cache would also need actions: write, which this workflow
          # does not grant. Leave the module cache off.
          cache: false

      - name: Affected packages
        id: affected
        if: steps.module.outputs.present == 'true'
        env:
          SHARD: ${{ matrix.shard }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Decide which packages this shard tests.
          # mode=full     push, workflow_dispatch, or a change we will not try to slice
          # mode=affected pull_request diff mapped to packages and their importers
          # mode=none     only docs or other non-code; the job stays green and runs nothing
          set -euo pipefail

          mod=$(go list -m)
          shard="${SHARD:?shard is required}"
          changed_file="${RUNNER_TEMP}/changed.txt"
          affected_file="${RUNNER_TEMP}/affected.txt"
          shard_file="${RUNNER_TEMP}/shard.txt"
          run_file="${RUNNER_TEMP}/test-packages.txt"
          pkgdirs="${RUNNER_TEMP}/pkgdirs.txt"
          deps_file="${RUNNER_TEMP}/deps.txt"
          embed_file="${RUNNER_TEMP}/embeds.txt"
          : >"$changed_file"
          : >"$affected_file"
          : >"$run_file"
          : >"$embed_file"

          go list -f '{{.Dir}} {{.ImportPath}}' ./... >"$pkgdirs"

          mode=full
          reason="event ${GITHUB_EVENT_NAME}"

          git_fetch() {
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              local auth
              auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
              git -c "http.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags "$@"
            else
              git fetch --no-tags "$@"
            fi
          }

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="${GITHUB_BASE_REF:?pull_request without a base ref}"
            echo "fetching origin/${base} so the diff is origin/${base}...HEAD"
            # A failed fetch must not shrink the suite. Checkout may already have the
            # base; if it does not, the missing merge base below selects the full suite.
            git_fetch origin "+refs/heads/${base}:refs/remotes/origin/${base}" || echo "fetch of origin/${base} failed; using the history already on this runner"
            depth=128
            while ! git merge-base "origin/${base}" HEAD >/dev/null 2>&1; do
              if [ "$depth" -gt 8192 ]; then
                echo "deepen did not find a merge base; unshallowing"
                git fetch --unshallow origin || true
                git_fetch origin "+refs/heads/${base}:refs/remotes/origin/${base}"
                break
              fi
              echo "no merge base yet; deepening by ${depth}"
              git_fetch --deepen="${depth}" origin "+refs/heads/${base}:refs/remotes/origin/${base}" || git_fetch --deepen="${depth}" origin || true
              depth=$((depth * 2))
            done
            if ! git merge-base "origin/${base}" HEAD >/dev/null 2>&1; then
              mode=full
              reason="no merge base between origin/${base} and HEAD"
            else
              # --no-renames lists both sides of a move, so the old package stays selected.
              git diff --no-renames --name-only "origin/${base}...HEAD" >"$changed_file"
              mode=decide
              reason="diff origin/${base}...HEAD"
            fi
          fi

          # //go:embed patterns, relative to the repo root. git grep stays inside the tree.
          while IFS= read -r gopath; do
            [ -z "$gopath" ] && continue
            dir=$(dirname "$gopath")
            dir=${dir#./}
            while IFS= read -r line; do
              specs=${line##*go:embed}
              specs=${specs#" "}
              # Specs are embed patterns, not shell globs. set -f stops * from expanding.
              set -f
              for spec in $specs; do
                spec=${spec#all:}
                printf '%s\n' "${dir}/${spec}" >>"$embed_file"
              done
              set +f
            # A real directive is //go:embed at the start of the line.
            # "// //go:embed ..." in migrations/embed.go is a comment, not a pattern.
            done < <(grep -E '^[[:space:]]*//go:embed([[:space:]]|$)' "$gopath" || true)
          done < <(git grep -l -e '//go:embed' -- '*.go' || true)

          is_embedded() {
            local f="$1" root
            while IFS= read -r root; do
              [ -z "$root" ] && continue
              # root is a go:embed pattern and may contain a glob on purpose.
              # shellcheck disable=SC2053
              if [[ "$f" == $root || "$f" == $root/* ]]; then
                return 0
              fi
            done <"$embed_file"
            return 1
          }

          # Top-level README and license files are the only markdown we skip.
          # docs/**/*.md and .cursor/** are not here: tests read some of them,
          # and anything unmapped falls through to the full suite.
          is_ignorable() {
            case "$1" in
              README.md | LICENSE | LICENSE.* | .gitignore | .gitattributes | .editorconfig | *.png | *.jpg | *.jpeg | *.gif | *.svg | *.webp)
                return 0
                ;;
            esac
            return 1
          }

          is_full_trigger() {
            case "$1" in
              go.mod | go.sum | Dockerfile | */Dockerfile | .github | .github/* | migrations | migrations/* | *.sql | *.templ)
                return 0
                ;;
            esac
            return 1
          }

          pkg_of_dir() {
            local dir="$1" pdir ip
            while read -r pdir ip; do
              if [ "$dir" = "$pdir" ]; then
                printf '%s\n' "$ip"
                return 0
              fi
            done <"$pkgdirs"
            return 1
          }

          # Package directory for a .go file is the directory that holds it.
          pkg_of_go() {
            local f="$1" dir
            dir=$(dirname "$f")
            dir="${PWD}/${dir}"
            pkg_of_dir "$dir"
          }

          # testdata belongs to the nearest parent that is a Go package.
          pkg_of_testdata() {
            local f="$1" dir
            dir="${f%%/testdata*}"
            dir="${PWD}/${dir}"
            while [ "$dir" != "/" ] && [ "$dir" != "${PWD}" ]; do
              if pkg_of_dir "$dir"; then
                return 0
              fi
              dir=$(dirname "$dir")
            done
            return 1
          }

          # Non-Go paths named by tests, resolved from the test file's directory.
          # A changed file that matches one selects that package. A file no
          # package reads, and that is not ignorable, still forces the full suite.
          reads_file="${RUNNER_TEMP}/reads.txt"
          : >"$reads_file"
          # "./", "../", and "../../" name a directory, not a file. shots_test.go
          # has "../" as a URL helper. Recording it selects every file under
          # internal/. Drop those literals, and any path that resolves to the
          # repo root or one top-level directory, so the change stays unmapped
          # and the full suite runs.
          dot_only() {
            local s="$1" part
            s=${s%/}
            [ -z "$s" ] && return 0
            local IFS=/
            for part in $s; do
              case "$part" in
                ""|.|..) ;;
                *) return 1 ;;
              esac
            done
            return 0
          }
          record_read() {
            local lit="$1" tdir="$2" pkg="$3" rel
            [ -z "$lit" ] && return 0
            case "$lit" in
              *'*'*|*'?'*|*'['*|*'${'*|*' '*|*'%'*) return 0 ;;
            esac
            if dot_only "$lit"; then
              return 0
            fi
            case "$lit" in
              ../*|./*|docs/*|.cursor/*|testdata/*|templates/*|fixtures/*|resources/*|static/*|internal/*|cmd/*|*.md|*.json|*.html|*.css|*.js|*.txt|*.templ|*.sql)
                ;;
              *) return 0 ;;
            esac
            rel=$(realpath -m --relative-to="$PWD" "$PWD/$tdir/$lit")
            case "$rel" in
              ""|.|..|../*) return 0 ;;
            esac
            # internal, cmd, docs, and any other single directory at the repo root.
            if [[ "$rel" != */* ]] && [ -d "$rel" ]; then
              return 0
            fi
            printf '%s\t%s\n' "$rel" "$pkg" >>"$reads_file"
            # A literal that already starts at the repo root is not relative
            # to the test file. docs/ and .cursor/ are the cross-package cases.
            case "$lit" in
              docs/*|.cursor/*)
                printf '%s\t%s\n' "$lit" "$pkg" >>"$reads_file"
                ;;
            esac
          }
          while IFS= read -r tg; do
            [ -z "$tg" ] && continue
            tdir=$(dirname "$tg")
            if ! pkg=$(pkg_of_go "$tg"); then
              continue
            fi
            while IFS= read -r lit; do
              record_read "$lit" "$tdir" "$pkg"
            done < <(grep -oE '"[^"]{1,240}"|`[^`]{1,240}`' "$tg" | tr -d '"`' || true)
          done < <(git ls-files '*_test.go' || true)

          # TestHebrewSourcesAreNFC reads testdata, templates, and fixtures
          # outside internal/web. clip-text-map.json is the one file it skips.
          nfc_extra() {
            case "$1" in
              internal/audio/testdata/clip-text-map.json) return 1 ;;
            esac
            case "$1" in
              */testdata/*|*/templates/*|*/fixtures/*)
                case "$1" in
                  *.templ|*.go|*.json|*.html|*.txt|*.md) return 0 ;;
                esac
                ;;
            esac
            return 1
          }
          web_pkg=$(pkg_of_dir "${PWD}/internal/web" || true)

          map_readers() {
            local f="$1" rpath rpkg hit=1
            [ -s "$reads_file" ] || return 1
            while IFS=$'\t' read -r rpath rpkg; do
              [ -z "$rpath" ] && continue
              if [ "$f" = "$rpath" ] || { [ -d "$rpath" ] && [[ "$f" == "$rpath"/* ]]; }; then
                printf '%s\n' "$rpkg" >>"$affected_file"
                hit=0
              fi
            done <"$reads_file"
            return "$hit"
          }

          if [ "$mode" = "decide" ]; then
            full_reason=""
            go_changed=0
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              if is_full_trigger "$f" || is_embedded "$f"; then
                full_reason="$f"
                break
              fi
              if [[ "$f" == *.go ]]; then
                go_changed=1
                if pkg=$(pkg_of_go "$f"); then
                  printf '%s\n' "$pkg" >>"$affected_file"
                else
                  full_reason="unmapped Go file ${f}"
                  break
                fi
                continue
              fi
              if [[ "$f" == */testdata/* || "$f" == */testdata ]]; then
                if pkg=$(pkg_of_testdata "$f"); then
                  printf '%s\n' "$pkg" >>"$affected_file"
                  map_readers "$f" || true
                  if nfc_extra "$f" && [ -n "$web_pkg" ]; then
                    printf '%s\n' "$web_pkg" >>"$affected_file"
                  fi
                  continue
                fi
                full_reason="unmapped testdata ${f}"
                break
              fi
              if map_readers "$f"; then
                continue
              fi
              if nfc_extra "$f" && [ -n "$web_pkg" ]; then
                printf '%s\n' "$web_pkg" >>"$affected_file"
                continue
              fi
              if is_ignorable "$f"; then
                continue
              fi
              full_reason="unmapped ${f}"
              break
            done <"$changed_file"

            if [ -n "$full_reason" ]; then
              mode=full
              reason="$full_reason"
            elif [ "$go_changed" = 1 ] && [ ! -s "$affected_file" ]; then
              mode=full
              reason="Go files changed but no package was mapped"
            elif [ ! -s "$affected_file" ]; then
              mode=none
              reason="no code changes"
            else
              mode=affected
              sort -u "$affected_file" -o "$affected_file"
              # Pipes separate Deps, TestImports, and XTestImports. Replace them so the
              # last dependency is not glued to the next import path.
              go list -f '{{.ImportPath}}|{{join .Deps " "}}|{{join .TestImports " "}}|{{join .XTestImports " "}}' ./... >"$deps_file"
              changed=1
              while [ "$changed" = 1 ]; do
                changed=0
                while IFS= read -r line; do
                  ip=${line%%|*}
                  case "$ip" in
                    "${mod}"/*) ;;
                    *) continue ;;
                  esac
                  if grep -qxF "$ip" "$affected_file"; then
                    continue
                  fi
                  rest=${line#*|}
                  rest=${rest//|/ }
                  for dep in $rest; do
                    if grep -qxF "$dep" "$affected_file"; then
                      printf '%s\n' "$ip" >>"$affected_file"
                      changed=1
                      break
                    fi
                  done
                done <"$deps_file"
              done
              sort -u "$affected_file" -o "$affected_file"
            fi
          fi

          case "$shard" in
            placement)
              go list ./internal/placement/... >"$shard_file"
              ;;
            app)
              go list ./internal/activity/... ./internal/brief/... ./internal/learner/... >"$shard_file"
              ;;
            web)
              go list ./internal/web/... >"$shard_file"
              ;;
            rest)
              # Catch-all. A new package is not named above, so it lands here.
              go list ./... | grep -v -E '/internal/(placement|activity|brief|learner|web)(/|$)' >"$shard_file" || true
              ;;
            *)
              echo "::error::unknown shard ${shard}"
              exit 1
              ;;
          esac

          if [ "$mode" = "full" ]; then
            cp "$shard_file" "$run_file"
            : >"$affected_file"
            go list ./... >"$affected_file"
          elif [ "$mode" = "affected" ]; then
            grep -Fxf "$affected_file" "$shard_file" >"$run_file" || true
          else
            : >"$run_file"
          fi

          web=false
          if [ "$mode" = "full" ] || grep -Eq '/internal/web(/|$)' "$affected_file"; then
            web=true
          fi
          run_tests=false
          if [ -s "$run_file" ]; then
            run_tests=true
          fi
          lint=false
          if [ "$shard" = "rest" ] && [ "$mode" != "none" ]; then
            lint=true
          fi

          {
            echo "mode=${mode}"
            echo "run_tests=${run_tests}"
            echo "web=${web}"
            echo "lint=${lint}"
          } >>"${GITHUB_OUTPUT}"

          {
            echo "### Affected packages (${shard})"
            echo
            echo "Mode: \`${mode}\` (${reason})."
            echo
            if [ -s "$changed_file" ]; then
              echo "Changed files:"
              echo
              echo '```'
              cat "$changed_file"
              echo '```'
              echo
            fi
            echo "Packages this run accounts for:"
            echo
            echo '```'
            if [ "$mode" = "none" ]; then
              echo "(none — docs or other non-code only)"
            else
              cat "$affected_file"
            fi
            echo '```'
            echo
            echo "This shard runs:"
            echo
            echo '```'
            if [ -s "$run_file" ]; then
              cat "$run_file"
            else
              echo "(none)"
            fi
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"

          echo "affected-packages: mode=${mode} reason=${reason} web=${web} run_tests=${run_tests} lint=${lint}"
          echo "changed files:"
          if [ -s "$changed_file" ]; then
            cat "$changed_file"
          else
            echo "(none recorded)"
          fi
          echo "affected packages:"
          if [ "$mode" = "none" ]; then
            echo "(none — docs or other non-code only)"
          else
            cat "$affected_file"
          fi
          echo "shard ${shard} runs:"
          if [ -s "$run_file" ]; then
            cat "$run_file"
          else
            echo "(none — no affected packages)"
          fi

      # gofmt, templ drift, and go vet run once, in shard C, on any run that
      # is not docs-only. A docs-only pull request leaves lint false and the
      # shard still succeeds. These checks already existed; this PR does not
      # add a new gate.
      - name: gofmt
        if: steps.module.outputs.present == 'true' && steps.affected.outputs.lint == 'true'
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"
            echo "$unformatted"
            exit 1
          fi

      - name: templ generate
        if: >-
          steps.module.outputs.present == 'true' &&
          (steps.affected.outputs.lint == 'true' ||
            (matrix.shard == 'web' && steps.affected.outputs.web == 'true' && steps.affected.outputs.run_tests == 'true'))
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^[[:space:]]*github.com\/a-h\/templ / { print $2; exit }' go.mod)
          if [ -z "$version" ]; then
            echo "templ is not a module dependency"
            exit 1
          fi
          bindir=$(mktemp -d)
          GOBIN="$bindir" go install "github.com/a-h/templ/cmd/templ@${version}"
          "$bindir/templ" generate
          if [ "${{ matrix.shard }}" = "rest" ]; then
            drift=$(git diff --name-only)
            if [ -n "$drift" ]; then
              echo "templ generate changed checked-in files:"
              echo "$drift"
              git diff
              exit 1
            fi
          fi

      - name: go vet
        if: steps.module.outputs.present == 'true' && steps.affected.outputs.lint == 'true'
        shell: bash
        run: go vet ./...

      # TestNotLinkedIntoHebrewBinary runs `go list -deps ./cmd/hebrew`.
      # Nothing in the import graph reaches that subprocess, so shard C runs
      # the guard on every change, including a docs-only pull request.
      - name: testharness not linked
        if: steps.module.outputs.present == 'true' && matrix.shard == 'rest'
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -timeout 20m -run '^TestNotLinkedIntoHebrewBinary$' ./internal/db/testharness

      # The k8-build image does not ship gcc. Run 39473171758 (#111) and
      # run 39479442471 both printed "gcc is not on PATH" and apt installed
      # a previously unselected gcc package. Skip the install when it is
      # already on PATH.
      - name: Install gcc
        if: steps.module.outputs.present == 'true' && steps.affected.outputs.run_tests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if command -v gcc >/dev/null 2>&1; then
            echo "gcc already present: $(command -v gcc)"
          else
            echo "gcc is not on PATH; installing gcc and libc6-dev"
            if [ "$(id -u)" -eq 0 ]; then
              DEBIAN_FRONTEND=noninteractive apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc libc6-dev
            else
              sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc libc6-dev
            fi
            echo "installed gcc: $(command -v gcc)"
          fi

      # -count=1 on every go test. Runners keep a persistent GOCACHE
      # (home_k3 #51), and Go does not record files a child process such as
      # node reads, so a cache hit can skip a real change.
      # Full seed counts. The race build tag is off, so race_off_test.go applies.
      - name: placement tests
        if: steps.module.outputs.present == 'true' && steps.affected.outputs.run_tests == 'true' && matrix.shard == 'placement'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pkgs < "${RUNNER_TEMP}/test-packages.txt"
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "no affected packages"
            exit 0
          fi
          echo "non-race placement: ${pkgs[*]}"
          start=$(date +%s)
          go test -count=1 -timeout 20m "${pkgs[@]}"
          echo "placement non-race finished in $(( $(date +%s) - start ))s"

      # TestListFirstPageOver50kAttempts asserts its time limit only when the
      # race detector is off. Learner lives in shard B. This step is before
      # the race build so the sample is not competing with this shard's own
      # race compile. LEARNER_PERF_SLACK=2 covers the other shards sharing
      # the node; local runs leave it unset and keep the 200ms limit.
      - name: learner tests
        if: steps.module.outputs.present == 'true' && steps.affected.outputs.run_tests == 'true' && matrix.shard == 'app'
        env:
          LEARNER_PERF_SLACK: "2"
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t all < "${RUNNER_TEMP}/test-packages.txt"
          pkgs=()
          for p in "${all[@]}"; do
            case "$p" in
              */internal/learner | */internal/learner/*) pkgs+=("$p") ;;
            esac
          done
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "no affected learner packages"
            exit 0
          fi
          echo "non-race learner: ${pkgs[*]}"
          start=$(date +%s)
          go test -count=1 -timeout 20m "${pkgs[@]}"
          echo "learner non-race finished in $(( $(date +%s) - start ))s"

      - name: go test -race
        if: steps.module.outputs.present == 'true' && steps.affected.outputs.run_tests == 'true'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          mapfile -t pkgs < "${RUNNER_TEMP}/test-packages.txt"
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "no affected packages"
            exit 0
          fi
          echo "race ${{ matrix.shard }}: ${pkgs[*]}"
          start=$(date +%s)
          go test -race -count=1 -timeout 20m "${pkgs[@]}"
          echo "race ${{ matrix.shard }} finished in $(( $(date +%s) - start ))s"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.module.outputs.present == 'true' && steps.affected.outputs.web == 'true' && matrix.shard == 'web'
        with:
          node-version: '22'

      - name: node version
        if: steps.module.outputs.present == 'true' && steps.affected.outputs.web == 'true' && matrix.shard == 'web'
        shell: bash
        run: node --version

      - name: node tests
        if: steps.module.outputs.present == 'true' && steps.affected.outputs.web == 'true' && matrix.shard == 'web'
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          go test -count=1 -v -run '^(TestClipPlayAfterSwap|TestKeyboardNode|TestReviewOrbSpacePlaysOnce)$' ./internal/web | tee node.out
          # A renamed test matches nothing, prints [no tests to run], and exits 0
          # with no --- SKIP line. Require the PASS lines. errexit ignores a
          # bare "! grep", so the skip check is an explicit if.
          # TestReviewOrbSpacePlaysOnce is added by #115 and is not on v3 yet.
          # Until `func TestReviewOrbSpacePlaysOnce` is in internal/web, a
          # missing PASS line means the test is absent, not skipped. Any
          # --- SKIP, including that test's "node not installed" skip once
          # it exists, still fails this step.
          if grep -q -- '--- SKIP' node.out; then
            echo "::error::a node test printed --- SKIP"
            exit 1
          fi
          if ! grep -q -- '--- PASS: TestClipPlayAfterSwap' node.out; then
            echo "::error::missing --- PASS: TestClipPlayAfterSwap"
            exit 1
          fi
          if ! grep -q -- '--- PASS: TestKeyboardNode' node.out; then
            echo "::error::missing --- PASS: TestKeyboardNode"
            exit 1
          fi
          if grep -R --include='*_test.go' -q -F 'func TestReviewOrbSpacePlaysOnce' internal/web; then
            if ! grep -q -- '--- PASS: TestReviewOrbSpacePlaysOnce' node.out; then
              echo "::error::missing --- PASS: TestReviewOrbSpacePlaysOnce"
              exit 1
            fi
          else
            echo "TestReviewOrbSpacePlaysOnce is not in this tree yet; not required"
          fi

  # The check name is exactly `test`. Branch protection and publish both
  # wait on it. always() is required so a failed shard still runs this job;
  # without it, a failure would skip `test` and the check would not go red.
  # The same base/fork guard as the shards is the only intended skip: a pull
  # request into main, or from a fork, skips every shard and skips `test`
  # too, so a skip is not reported as success. Any other result (failure,
  # cancelled, or a skipped matrix) fails the gate. A matrix leg that runs
  # and finds no packages exits 0; that is success, not a skip.
  test:
    name: test
    needs: shard
    runs-on: k8-build
    timeout-minutes: 5
    if: >-
      always() &&
      github.base_ref != 'main' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Require every shard to succeed
        shell: bash
        run: |
          set -euo pipefail
          result="${{ needs.shard.result }}"
          echo "shard result: ${result}"
          if [ "$result" != "success" ]; then
            echo "::error::shard result is ${result}. A skipped, failed, or cancelled shard does not pass."
            exit 1
          fi

  build-and-smoke:
    needs: test
    runs-on: k8-build
    timeout-minutes: 30
    # needs.test success is required here because a job-level if replaces the
    # default success() check. Pull requests only. contents: read, so this
    # job cannot be granted packages: write. Fork pull requests never reach
    # this runner. No login and no push.
    if: >-
      github.base_ref != 'main' &&
      needs.test.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      # pull_request only. No ref: refs/pull/N/merge at github.sha.
      # Do not pin pull_request.head.sha.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      # The tag is sha-<full 40-character commit>. On this job that commit is
      # the merge ref: git rev-parse HEAD, which is github.sha for the event.
      # The tag is local. This job never logs in or pushes. Fail before the
      # build if that name contains hebrew-lessons.
      - name: Refuse a hebrew-lessons image name
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::refusing to tag; HEAD is not a full 40-character sha"
            exit 1
          fi
          computed="${IMAGE}:sha-${sha}"
          case "$computed" in
            *hebrew-lessons*)
              echo "::error::refusing to publish ${computed}"
              exit 1
              ;;
          esac
          # The skeleton may add this script later. The inline check above
          # always runs, whether or not the script is in the tree.
          if [ -f scripts/check-image-name.sh ]; then
            bash scripts/check-image-name.sh "$computed"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${computed}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Image name ${computed} does not contain hebrew-lessons."

      # This job never pushes. With either file absent, it stays green and
      # the build is skipped.
      - name: Skip unless Dockerfile and go.mod exist
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Dockerfile ] && [ -f go.mod ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Dockerfile and go.mod are present."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Image skipped::Dockerfile or go.mod is absent. Build, smoke, and push are skipped."
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.scope.outputs.build == 'true'

      # No login and no cache-to: a pull request must not push, including the
      # buildcache tag. A cache miss is ignored.
      - name: Build (pull request, no push)
        if: steps.scope.outputs.build == 'true' && github.event_name == 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: ${{ steps.guard.outputs.tag }}
          build-args: |
            GIT_SHA=${{ steps.guard.outputs.sha }}
            BUILT_AT=${{ steps.guard.outputs.built_at }}
          labels: |
            org.opencontainers.image.revision=${{ steps.guard.outputs.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache,ignore-error=true

      # Start the image and wait until GET /healthz on port 8080 returns 200.
      # The probe shares the app network namespace. Nothing is published with -p.
      - name: Smoke the image
        if: steps.scope.outputs.build == 'true'
        shell: bash
        env:
          TAG: ${{ steps.guard.outputs.tag }}
          EXPECT_SHA: ${{ steps.guard.outputs.sha }}
        run: |
          set -euo pipefail
          run_id="${GITHUB_RUN_ID:-0}"
          attempt="${GITHUB_RUN_ATTEMPT:-0}"
          name="hebrew-v2-${run_id}-${attempt}-$$"
          probe="hebrew-v2-probe-${run_id}-${attempt}-$$"
          cleanup() {
            code=$?
            docker rm -f "$probe" "$name" >/dev/null 2>&1 || true
            exit "$code"
          }
          trap cleanup EXIT
          docker rm -f "$probe" "$name" >/dev/null 2>&1 || true
          echo "smoke: app ${name}, probe ${probe}, network container:${name}, no published ports"
          docker run -d --name "$name" "$TAG"
          if ! docker run -d --name "$probe" --network "container:${name}" busybox:1.36.1 sleep 90; then
            echo "smoke probe failed to start" >&2
            docker logs "$name" >&2 || true
            exit 1
          fi
          deadline=$((SECONDS + 60))
          last=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            output="$(docker exec "$probe" wget -S -O /dev/null "http://127.0.0.1:8080/healthz" 2>&1 || true)"
            code="$(printf '%s\n' "$output" | awk '/HTTP\//{ print $2; exit }')"
            if [ "$code" = "200" ]; then
              echo "GET /healthz 200"
              # EXPECT_SHA is git rev-parse HEAD, the same value passed as
              # GIT_SHA. On pull_request that is github.sha, the merge ref
              # this job checked out, not pull_request.head.sha.
              if [ -z "${EXPECT_SHA}" ]; then
                echo "::error::EXPECT_SHA is empty" >&2
                exit 1
              fi
              voutput="$(docker exec "$probe" wget -S -O - "http://127.0.0.1:8080/version" 2>&1 || true)"
              vcode="$(printf '%s\n' "$voutput" | awk '/HTTP\//{ print $2; exit }')"
              if [ "$vcode" != "200" ]; then
                echo "::error::GET /version status ${vcode:-none}" >&2
                printf '%s\n' "$voutput" >&2
                exit 1
              fi
              if ! printf '%s\n' "$voutput" | grep -q "Cache-Control: no-store"; then
                echo "::error::/version missing Cache-Control: no-store" >&2
                printf '%s\n' "$voutput" >&2
                exit 1
              fi
              if ! printf '%s\n' "$voutput" | grep -Fq "\"commit\":\"${EXPECT_SHA}\""; then
                echo "::error::/version commit is not ${EXPECT_SHA}" >&2
                printf '%s\n' "$voutput" >&2
                exit 1
              fi
              echo "GET /version commit=${EXPECT_SHA}"
              exit 0
            fi
            last="$code"
            sleep 1
          done
          echo "::error::/healthz did not return 200 on port 8080 within 60s (last: ${last:-none})" >&2
          docker logs "$name" >&2 || true
          exit 1

      - name: Remove the local image
        if: always() && steps.scope.outputs.build == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: docker image rm "${{ steps.guard.outputs.tag }}" || true

  publish:
    needs: test
    runs-on: k8-build
    timeout-minutes: 30
    # needs.test success is required here because a job-level if replaces the
    # default success() check. packages: write is granted only when this job
    # runs, which is a push to v3, never a pull_request.
    if: >-
      needs.test.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/v3'
    permissions:
      contents: read
      packages: write
    steps:
      # Push to v3 only. ref is the pushed commit, which the sha- tag
      # records. This job does not run on pull_request, and it does not
      # read pull_request.head.sha.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      # The tag is sha-<full 40-character commit>. Fail before login, build,
      # or push if that name contains hebrew-lessons.
      - name: Refuse a hebrew-lessons image name
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::refusing to tag; HEAD is not a full 40-character sha"
            exit 1
          fi
          computed="${IMAGE}:sha-${sha}"
          case "$computed" in
            *hebrew-lessons*)
              echo "::error::refusing to publish ${computed}"
              exit 1
              ;;
          esac
          # The skeleton may add this script later. The inline check above
          # always runs, whether or not the script is in the tree.
          if [ -f scripts/check-image-name.sh ]; then
            bash scripts/check-image-name.sh "$computed"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${computed}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Image name ${computed} does not contain hebrew-lessons."

      # Push to the registry only on a push to v3, and only when both files
      # exist. With neither file yet, the job stays green and the build is skipped.
      - name: Skip unless Dockerfile and go.mod exist
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Dockerfile ] && [ -f go.mod ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Dockerfile and go.mod are present."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Image skipped::Dockerfile or go.mod is absent. Build, smoke, and push are skipped."
          fi

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: steps.scope.outputs.build == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/v3'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.scope.outputs.build == 'true'

      - name: Build
        if: steps.scope.outputs.build == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/v3'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: ${{ steps.guard.outputs.tag }}
          build-args: |
            GIT_SHA=${{ steps.guard.outputs.sha }}
            BUILT_AT=${{ steps.guard.outputs.built_at }}
          labels: |
            org.opencontainers.image.revision=${{ steps.guard.outputs.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,ignore-error=true

      # Start the image and wait until GET /healthz on port 8080 returns 200.
      # The probe shares the app network namespace. Nothing is published with -p.
      - name: Smoke the image
        if: steps.scope.outputs.build == 'true'
        shell: bash
        env:
          TAG: ${{ steps.guard.outputs.tag }}
          EXPECT_SHA: ${{ steps.guard.outputs.sha }}
        run: |
          set -euo pipefail
          run_id="${GITHUB_RUN_ID:-0}"
          attempt="${GITHUB_RUN_ATTEMPT:-0}"
          name="hebrew-v2-${run_id}-${attempt}-$$"
          probe="hebrew-v2-probe-${run_id}-${attempt}-$$"
          cleanup() {
            code=$?
            docker rm -f "$probe" "$name" >/dev/null 2>&1 || true
            exit "$code"
          }
          trap cleanup EXIT
          docker rm -f "$probe" "$name" >/dev/null 2>&1 || true
          echo "smoke: app ${name}, probe ${probe}, network container:${name}, no published ports"
          docker run -d --name "$name" "$TAG"
          if ! docker run -d --name "$probe" --network "container:${name}" busybox:1.36.1 sleep 90; then
            echo "smoke probe failed to start" >&2
            docker logs "$name" >&2 || true
            exit 1
          fi
          deadline=$((SECONDS + 60))
          last=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            output="$(docker exec "$probe" wget -S -O /dev/null "http://127.0.0.1:8080/healthz" 2>&1 || true)"
            code="$(printf '%s\n' "$output" | awk '/HTTP\//{ print $2; exit }')"
            if [ "$code" = "200" ]; then
              echo "GET /healthz 200"
              # EXPECT_SHA is git rev-parse HEAD, the same value passed as
              # GIT_SHA. On pull_request that is github.sha, the merge ref
              # this job checked out, not pull_request.head.sha.
              if [ -z "${EXPECT_SHA}" ]; then
                echo "::error::EXPECT_SHA is empty" >&2
                exit 1
              fi
              voutput="$(docker exec "$probe" wget -S -O - "http://127.0.0.1:8080/version" 2>&1 || true)"
              vcode="$(printf '%s\n' "$voutput" | awk '/HTTP\//{ print $2; exit }')"
              if [ "$vcode" != "200" ]; then
                echo "::error::GET /version status ${vcode:-none}" >&2
                printf '%s\n' "$voutput" >&2
                exit 1
              fi
              if ! printf '%s\n' "$voutput" | grep -q "Cache-Control: no-store"; then
                echo "::error::/version missing Cache-Control: no-store" >&2
                printf '%s\n' "$voutput" >&2
                exit 1
              fi
              if ! printf '%s\n' "$voutput" | grep -Fq "\"commit\":\"${EXPECT_SHA}\""; then
                echo "::error::/version commit is not ${EXPECT_SHA}" >&2
                printf '%s\n' "$voutput" >&2
                exit 1
              fi
              echo "GET /version commit=${EXPECT_SHA}"
              exit 0
            fi
            last="$code"
            sleep 1
          done
          echo "::error::/healthz did not return 200 on port 8080 within 60s (last: ${last:-none})" >&2
          docker logs "$name" >&2 || true
          exit 1

      - name: Push the image
        if: steps.scope.outputs.build == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/v3'
        shell: bash
        env:
          TAG: ${{ steps.guard.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" != "refs/heads/v3" ]; then
            echo "::error::refusing to push except on a push to v3"
            exit 1
          fi
          case "$TAG" in
            *hebrew-lessons*)
              echo "::error::refusing to publish ${TAG}"
              exit 1
              ;;
          esac
          if [ -f scripts/check-image-name.sh ]; then
            bash scripts/check-image-name.sh "$TAG"
          fi
          docker push "$TAG"
