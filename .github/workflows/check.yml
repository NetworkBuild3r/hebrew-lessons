# Typecheck and bundle the player on pull requests. Does not push an image.
# The runtime image build (image.yml) runs the same Dockerfile player stage.
# Same runner constraint as image.yml: never use a GitHub-hosted runner.
name: check

on:
  pull_request:

jobs:
  player:
    runs-on: k8-build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Typecheck and build the player bundle
        run: docker build --target player .
