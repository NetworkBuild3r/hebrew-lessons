# Build the Node image from the pull request head and smoke it.
# This is not a publish path. It does not log in to GHCR, tag a registry
# image, or push. The publish gate stays in image.yml.
#
# Runs only on the local ARC scale set (k8-build). That runner's DOCKER_HOST
# is the shared docker-builder. Do not set DOCKER_HOST here, and do not
# publish ports; image-smoke.sh probes inside the container network.
name: image-smoke

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - server/**
      - mcp/**
      - shared/**
      - worksheets/**
      - login/**
      - scripts/**
      - icon.svg
      - manifest.webmanifest
      - .cursor/skills/hebrew-worksheet/**
      - docs/decisions/ADR-0003-assets/lesson-plan.schema.json
      - .github/**

permissions:
  contents: read

# Cancel a superseded pull request. This workflow has no push trigger.
concurrency:
  group: image-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    # Fork pull requests must not build on the self-hosted runner.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: k8-build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Same rules as image.yml: docs/**, sdd/**, and markdown do not build,
      # except the lesson-plan schema the server reads. The diff is the whole
      # pull request, not one commit.
      - name: Skip docs-only pull requests
        id: scope
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          # Checkout does not persist credentials. This private fetch uses the
          # job token for this command only; it is not written into git config.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          full_sha='^[0-9a-f]{40}$'
          if ! [[ "$PR_HEAD" =~ $full_sha && "$PR_BASE" =~ $full_sha ]]; then
            echo "::error::Refusing to build. PR head or base is not a full SHA."
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$PR_HEAD" ]; then
            echo "::error::Checked out ${actual}, but the pull request head is ${PR_HEAD}."
            exit 1
          fi
          git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" fetch --depth=1 origin "$PR_BASE"
          mapfile -d '' files < <(git diff -z --name-only "$PR_BASE" HEAD)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "No files between ${PR_BASE} and ${PR_HEAD}; building."
            exit 0
          fi
          echo "Changed files:"
          build=false
          for f in "${files[@]}"; do
            [ -n "$f" ] || continue
            printf '  %s\n' "$f"
            base="${f##*/}"
            case "$f" in
              docs/decisions/ADR-0003-assets/lesson-plan.schema.json)
                build=true
                continue
                ;;
              docs/*|sdd/*) continue ;;
            esac
            case "$base" in
              *.md) continue ;;
            esac
            build=true
          done
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          if [ "$build" = "true" ]; then
            echo "Code changed; building ${PR_HEAD}."
          else
            echo "Docs-only pull request; skipping the image build."
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.scope.outputs.build == 'true'
      # Local tag only. contents: read cannot pull a private GHCR cache, so a
      # cache miss is ignored; there is still no cache-to.
      - uses: docker/build-push-action@v6
        if: steps.scope.outputs.build == 'true'
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: hebrew-lessons:smoke-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=registry,ref=ghcr.io/networkbuild3r/hebrew-lessons:buildcache,ignore-error=true
      - name: Smoke the image
        if: steps.scope.outputs.build == 'true'
        shell: bash
        run: .github/image-smoke.sh "hebrew-lessons:smoke-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Remove the local image
        if: always() && steps.scope.outputs.build == 'true'
        shell: bash
        run: docker image rm "hebrew-lessons:smoke-${{ github.run_id }}-${{ github.run_attempt }}" || true
