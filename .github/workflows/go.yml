# Go server checks. Separate from image.yml so image builds are not affected.
# Runs only on the local ARC scale set registered to this repo (see home_k3
# apps/arc-runner-set-hebrew). Never use GitHub-hosted runners.
#
# pull_request on the self-hosted k8-build runner is safe only while this
# repository stays private, or while fork pull requests need approval before
# workflows run. A public repo that runs untrusted pull-request code on
# k8-build would expose that runner.
name: go

on:
  # `edited` is how a base-branch change arrives. A force-push followed by a
  # base change does not otherwise start a run: synchronize can be dropped,
  # and the default pull_request types omit edited. The job condition below
  # runs that event only when github.event.changes.base is set.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: k8-build
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: gofmt
        working-directory: go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        working-directory: go
        run: go vet ./...
      - name: staticcheck
        run: |
          tool_dir=$(mktemp -d)
          GOBIN="$tool_dir" go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          cd go
          "$tool_dir/staticcheck" ./...
      - name: go test
        working-directory: go
        run: go test ./...
