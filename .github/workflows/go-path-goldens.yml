# Regenerates the learner-path due and exactKey goldens from Node and
# fails if they drift. Separate from .github/workflows/go.yml so go test
# does not run Node for those checks.
#
# Runs only on the local ARC scale set (k8-build). Never use GitHub-hosted runners.
# Node is pinned to 22.14.0 (Unicode 16.0). The generator refuses any other
# process.versions.unicode.
name: go-path-goldens

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-path-goldens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-diff:
    runs-on: k8-build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Regenerate goldens
        run: node go/tools/golden/path.js
      - name: Goldens match the commit
        run: |
          git diff --exit-code -- \
            go/internal/learner/path/testdata/golden \
            go/internal/textkey/testdata/golden
