# Regenerates lesson-data goldens from Node and fails if they drift.
# Runs only on the local ARC scale set registered to this repo (see home_k3
# apps/arc-runner-set-hebrew). Never use GitHub-hosted runners.
#
# pull_request on the self-hosted k8-build runner is safe only while this
# repository stays private, or while fork pull requests need approval before
# workflows run. A public repo that runs untrusted pull-request code on
# k8-build would expose that runner.
name: go-lessondata-goldens

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-lessondata-goldens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goldens:
    runs-on: k8-build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Regenerate goldens
        run: node scripts/generate-lessondata-goldens.js
      - name: Fail if goldens drifted
        run: |
          status=$(git status --porcelain -- go/internal/lessondata/testdata/golden)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            git --no-pager diff -- go/internal/lessondata/testdata/golden
            exit 1
          fi
      - name: Test the parser and writers
        working-directory: go
        run: go test ./internal/lessondata/
