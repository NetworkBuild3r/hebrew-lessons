# Build and publish the Go server image.
# Runs only on the local ARC scale set registered to this repo (see home_k3
# apps/arc-runner-set-hebrew). Never use GitHub-hosted runners.
#
# k8-build provides DOCKER_HOST (tcp to the shared docker-builder) and buildx.
# Do not set DOCKER_HOST here.
#
# Triggers match image.yml: push to main, and workflow_dispatch. No path
# filter and no pull_request. A main push that has no go/go.mod still
# succeeds; vet, test, and the image build are skipped (see the first step).
#
# This file does not replace image.yml. The Node image stays
# ghcr.io/networkbuild3r/hebrew-lessons. Tag, cache, and the home_k3
# hebrew-next Deployment: docs/operations/go-image.md.
name: image-go

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: k8-build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Green job when this commit has no Go module yet (the workflow can
      # land before go/). Later steps are skipped. ::notice:: does not fail
      # the job.
      - name: Skip when go/go.mod is absent
        id: module
        run: |
          if [ -f go/go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "go/go.mod is present."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Go image skipped::go/go.mod is not in this commit. go vet, go test, and the image build are skipped."
          fi

      - uses: actions/setup-go@v7
        if: steps.module.outputs.present == 'true'
        with:
          go-version-file: go/go.mod

      # Go-1a's ledger tests spawn a Node helper against server/db/migrations.
      # Node 22 matches the server. No npm ci: the helper uses the stdlib.
      - uses: actions/setup-node@v4
        if: steps.module.outputs.present == 'true'
        with:
          node-version: 22

      - name: Read Go version from go/go.mod
        id: goversion
        if: steps.module.outputs.present == 'true'
        run: |
          version=$(awk '/^go [0-9]/ { print $2; exit }' go/go.mod)
          if [ -z "$version" ]; then
            echo "go/go.mod has no go version line" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Go version from go/go.mod: ${version}"

      - name: go vet
        if: steps.module.outputs.present == 'true'
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: go test
        if: steps.module.outputs.present == 'true'
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - uses: docker/setup-buildx-action@v3
        if: steps.module.outputs.present == 'true'

      - uses: docker/login-action@v3
        if: steps.module.outputs.present == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        if: steps.module.outputs.present == 'true'
        with:
          images: ghcr.io/networkbuild3r/hebrew-lessons-go
          # sha-<full sha> only. latest is not a deploy tag.
          flavor: |
            latest=false
          tags: |
            type=sha,format=long

      - name: Build and push
        if: steps.module.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.go
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.version }}
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/networkbuild3r/hebrew-lessons-go:buildcache
          cache-to: type=registry,ref=ghcr.io/networkbuild3r/hebrew-lessons-go:buildcache,mode=max
