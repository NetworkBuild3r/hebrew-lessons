# Build and publish the Go server image.
# Runs only on the local ARC scale set registered to this repo (see home_k3
# apps/arc-runner-set-hebrew). Never use GitHub-hosted runners.
#
# k8-build provides DOCKER_HOST (tcp to the shared docker-builder) and buildx.
# Do not set DOCKER_HOST here.
#
# No push trigger. The gate matches image.yml in PR #18 (branch protection is
# unavailable on this private repo). A push to main runs `test`; this workflow
# builds that exact commit only after `test` succeeds. workflow_dispatch is
# not an open path: the sha (default: current main HEAD) must already have a
# successful `test` run on main. Checkout and the image tag are that SHA, not
# github.sha (on workflow_run, github.sha is the default-branch tip).
#
# After the gate, a docs-only commit is skipped (paths-ignore does not apply
# to workflow_run). A commit with no go/go.mod still succeeds: vet, test, and
# the image build are skipped. This file does not replace image.yml.
# Tag, cache, and the home_k3 hebrew-next Deployment: docs/operations/go-image.md.
name: image-go

on:
  workflow_run:
    workflows: ["test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          Full 40-character commit to build. Leave empty to use the current
          main HEAD. A completed successful `test` run for this exact SHA on
          main is required (this is also how a rollback rebuild is allowed).
        required: false
        type: string

jobs:
  build:
    runs-on: k8-build
    timeout-minutes: 30
    # Queue a later main build behind the one already running. Do not cancel it.
    concurrency:
      group: image-go-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      # Pick the commit, then prove `test` passed for it. Never fall back to
      # github.sha: on workflow_run that is the default-branch tip, not the
      # commit that was tested.
      - name: Resolve and gate the commit
        id: target
        uses: actions/github-script@v7
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || '' }}
        with:
          script: |
            const fullSha = /^[0-9a-f]{40}$/;
            const eventName = context.eventName;

            function refuse(message) {
              core.setFailed(message);
            }

            let sha;
            if (eventName === 'workflow_run') {
              const run = context.payload.workflow_run || {};
              sha = String(run.head_sha || '').trim().toLowerCase();
              if (!fullSha.test(sha)) {
                refuse(
                  'Refusing to build. workflow_run.head_sha is missing or not a full SHA, ' +
                  'so this would not build the commit test ran. Got: ' + JSON.stringify(sha)
                );
                return;
              }
              const headRepo = run.head_repository && run.head_repository.full_name;
              if (run.conclusion !== 'success' || run.event !== 'push' || run.head_branch !== 'main' || headRepo !== process.env.GITHUB_REPOSITORY) {
                refuse(
                  'Refusing to build ' + sha + '. Need test conclusion=success, event=push, head_branch=main, ' +
                  'head_repository=' + process.env.GITHUB_REPOSITORY + '. ' +
                  'Got conclusion=' + run.conclusion + ' event=' + run.event +
                  ' head_branch=' + run.head_branch + ' head_repository=' + headRepo + '.'
                );
                return;
              }
              core.setOutput('sha', sha);
              core.info('Building tested main commit ' + sha);
              return;
            }

            sha = String(process.env.REQUESTED_SHA || '').trim().toLowerCase();
            if (!sha) {
              let main;
              try {
                main = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: 'main'
                });
              } catch (err) {
                refuse('Refusing to build. Could not resolve the current main HEAD: ' + (err && err.message ? err.message : err));
                return;
              }
              sha = String(main.data.sha || '').trim().toLowerCase();
              core.info('No sha input. Current main HEAD is ' + sha);
            }
            if (!fullSha.test(sha)) {
              const shown = sha.length > 80 ? sha.slice(0, 80) + '…' : sha;
              refuse('Refusing to build. sha must be the full 40-character commit id. Got: ' + JSON.stringify(shown));
              return;
            }

            let listed;
            try {
              listed = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'test.yml',
                head_sha: sha,
                branch: 'main',
                event: 'push',
                status: 'success',
                per_page: 100
              });
            } catch (err) {
              refuse(
                'Refusing to build ' + sha + '. Could not look up `test` workflow runs: ' +
                (err && err.message ? err.message : err)
              );
              return;
            }
            const runs = (listed.data && listed.data.workflow_runs) || [];
            const match = runs.find((run) =>
              run.head_sha === sha &&
              run.head_branch === 'main' &&
              run.event === 'push' &&
              run.status === 'completed' &&
              run.conclusion === 'success' &&
              run.name === 'test'
            );
            if (!match) {
              refuse(
                'Refusing to build ' + sha + '. No completed successful run of the test workflow ' +
                '(.github/workflows/test.yml, name `test`) for this exact commit on main (event push). ' +
                'A pull-request run does not count. Push the commit to main and wait for test to pass, ' +
                'or dispatch an older full SHA that already passed on main.'
              );
              return;
            }
            core.setOutput('sha', sha);
            core.info('test passed for ' + sha + ' on main (' + match.html_url + '). Building.');

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 2

      # paths-ignore does not apply to workflow_run. Skip when every file in
      # the gated commit is docs/**, sdd/**, or a markdown file.
      # Dispatch still builds that commit (the test gate above already ran).
      # docs/decisions/ADR-0003-assets/lesson-plan.schema.json is not docs-only:
      # the Node server reads it, and this skip matches image.yml.
      - name: Skip docs-only commits
        id: scope
        shell: bash
        run: |
          set -eu
          expected="${{ steps.target.outputs.sha }}"
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Refusing to build. Checked out ${actual}, but the gate selected ${expected}."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch of ${actual}: building."
            exit 0
          fi
          sha="$actual"
          if ! git rev-parse --verify --quiet "${sha}^1" >/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "No parent for ${sha}; building."
            exit 0
          fi
          mapfile -d '' files < <(git diff -z --name-only "${sha}^1" "${sha}")
          if [ "${#files[@]}" -eq 0 ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "No files in ${sha}; building."
            exit 0
          fi
          echo "Changed files:"
          build=false
          for f in "${files[@]}"; do
            [ -n "$f" ] || continue
            printf '  %s\n' "$f"
            base="${f##*/}"
            case "$f" in
              docs/decisions/ADR-0003-assets/lesson-plan.schema.json)
                build=true
                continue
                ;;
              docs/*|sdd/*) continue ;;
            esac
            case "$base" in
              *.md) continue ;;
            esac
            build=true
          done
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          if [ "$build" = "true" ]; then
            echo "Code changed; building ${sha}."
          else
            echo "Docs-only commit ${sha}; skipping the image build."
          fi

      # Green job when this commit has no Go module yet (the workflow can
      # land before go/). Later steps are skipped. ::notice:: does not fail
      # the job. A docs-only commit never reaches this step.
      - name: Skip when go/go.mod is absent
        id: module
        if: steps.scope.outputs.build == 'true'
        run: |
          if [ -f go/go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "go/go.mod is present."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Go image skipped::go/go.mod is not in this commit. go vet, go test, and the image build are skipped."
          fi

      - uses: actions/setup-go@v7
        if: steps.scope.outputs.build == 'true' && steps.module.outputs.present == 'true'
        with:
          go-version-file: go/go.mod

      # Go-1a's ledger tests spawn a Node helper against server/db/migrations.
      # Node 22 matches the server. No npm ci: the helper uses the stdlib.
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.build == 'true' && steps.module.outputs.present == 'true'
        with:
          node-version: 22

      - name: Read Go version from go/go.mod
        id: goversion
        if: steps.scope.outputs.build == 'true' && steps.module.outputs.present == 'true'
        run: |
          version=$(awk '/^go [0-9]/ { print $2; exit }' go/go.mod)
          if [ -z "$version" ]; then
            echo "go/go.mod has no go version line" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Go version from go/go.mod: ${version}"

      - name: go vet
        if: steps.scope.outputs.build == 'true' && steps.module.outputs.present == 'true'
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: go test
        if: steps.scope.outputs.build == 'true' && steps.module.outputs.present == 'true'
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - uses: docker/setup-buildx-action@v3
        if: steps.scope.outputs.build == 'true' && steps.module.outputs.present == 'true'

      - uses: docker/login-action@v3
        if: steps.scope.outputs.build == 'true' && steps.module.outputs.present == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        if: steps.scope.outputs.build == 'true' && steps.module.outputs.present == 'true'
        with:
          # Tag the gated commit, not workflow_run's github.sha (main's tip).
          # type=raw keeps the existing sha-<full sha> tag text.
          images: ghcr.io/networkbuild3r/hebrew-lessons-go
          tags: |
            type=raw,value=sha-${{ steps.target.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.target.outputs.sha }}

      - name: Build and push
        if: steps.scope.outputs.build == 'true' && steps.module.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.go
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.version }}
            VERSION=${{ steps.target.outputs.sha }}
            COMMIT=${{ steps.target.outputs.sha }}
          cache-from: type=registry,ref=ghcr.io/networkbuild3r/hebrew-lessons-go:buildcache
          cache-to: type=registry,ref=ghcr.io/networkbuild3r/hebrew-lessons-go:buildcache,mode=max
