# Node test suite. Separate from image.yml so image builds are not affected.
# Runs only on the local ARC scale set registered to this repo (see home_k3
# apps/arc-runner-set-hebrew). Never use GitHub-hosted runners.
#
# pull_request on the self-hosted k8-build runner is safe only while this
# repository stays private, or while fork pull requests need approval before
# workflows run. A public repo that runs untrusted pull-request code on
# k8-build would expose that runner.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-test:
    runs-on: k8-build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: TZ=UTC npm test

  # contract-suite lands with the contract harness PR. Kept as its own job so
  # it is not folded into image.yml and does not run until that harness exists.
  contract-suite:
    if: false
    runs-on: k8-build
    timeout-minutes: 30
    steps:
      - run: echo "contract suite is not wired yet"
